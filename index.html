<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportsHub — Eventi sportivi</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <header class="site-header ">
    <!-- Titolo dell'app + form di ricerca -->
    <h1>SportsHub</h1>
    <p>Cerca una squadra, scopri prossime partite e ultimi risultati</p>
    <form id="ricerca" class="d-flex gap-2">
      <label for="search"></label>
      <input type="text" id="search" class="form-control">
      <button type="submit" class="btn btn-light fw-semibold">Cerca</button>
    </form>
  </header>

  <main class="container">

    <section id="preferiti-section">
      <h2><i class="bi bi-star-fill text-warning"></i> Le tue squadre preferite</h2>
      <div id="lista-preferiti" class="row justify-content-center gx-3 gy-3"></div>
    </section>

    <section id="risultati-section">
      <!-- Spinner, errore, lista risultati ricerca squadre -->
      <div id="spinner-ricerca" class="text-center my-4" hidden>
        <div class="spinner-border" role="status"></div>
      </div>
      <h2 class="mb-5">Squadre trovate</h2>
      <div id="lista-squadre" class="row justify-content-center gx-3 gy-3">
      </div>
    </section>

    <section id="squadra-fissa-section">
      <div id="squadra-fissa" class="row justify-content-center gx-3 gy-3"></div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="assets/js/script.js"></script>
</body>

</html>
